  </g>
  <!-- cart badge -->
  <circle cx="700" cy="120" r="44" fill="#ffffff"/>
  <path d="M676 104 h8 l8 30 h26 l6 -20 h-36" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="696" cy="142" r="4" fill="#6d28d9"/><circle cx="714" cy="142" r="4" fill="#6d28d9"/>
  <circle cx="726" cy="92" r="14" fill="url(#gold)"/><text x="726" y="97" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#1f1300">3</text>

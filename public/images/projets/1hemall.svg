  <rect x="72" y="340" width="286" height="70" rx="14" fill="url(#gold)"/>
  <rect x="92" y="360" width="140" height="12" rx="6" fill="#1f1300" fill-opacity="0.8"/>
  <rect x="92" y="382" width="90" height="10" rx="5" fill="#1f1300" fill-opacity="0.5"/>
  <!-- hero phone -->
  <g transform="rotate(-10 560 250)">
    <rect x="480" y="90" width="160" height="320" rx="30" fill="url(#ph)"/>
    <rect x="490" y="100" width="140" height="300" rx="24" fill="#0b0b14"/>
    <rect x="502" y="112" width="116" height="276" rx="18" fill="url(#acc)"/>
    <circle cx="560" cy="210" r="34" fill="#ffffff" fill-opacity="0.25"/>

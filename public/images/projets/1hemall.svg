    <circle cx="128" cy="200" r="6" fill="#374151"/><circle cx="128" cy="216" r="6" fill="#374151"/>
    <rect x="86" y="292" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="86" y="306" width="44" height="8" rx="4" fill="url(#gold)"/>
    <rect x="222" y="172" width="136" height="150" rx="14" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="252" y="196" width="76" height="52" rx="6" fill="#1f2937" stroke="#9ca3af" stroke-width="3"/>
    <rect x="242" y="250" width="96" height="8" rx="4" fill="#9ca3af"/>
    <rect x="236" y="292" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="236" y="306" width="44" height="8" rx="4" fill="url(#gold)"/>

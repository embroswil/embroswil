<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a2e"/><stop offset="0.55" stop-color="#0b4a52"/><stop offset="1" stop-color="#041a1d"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6c4"/><stop offset="1" stop-color="#4A6CF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee6c4" stop-opacity="0.45"/><stop offset="1" stop-color="#3ee6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="240" fill="url(#glow)"/>
  <!-- phone -->
  <rect x="200" y="60" width="200" height="380" rx="32" fill="#0a1416" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="215" y="80" width="170" height="340" rx="22" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="270" y="90" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <!-- avatar -->
  <circle cx="300" cy="190" r="56" fill="url(#avatar)"/>
  <circle cx="300" cy="175" r="22" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M262 228 a38 30 0 0 1 76 0" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="245" y="265" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="265" y="285" width="70" height="8" rx="4" fill="#3ee6c4" fill-opacity="0.8"/>
  <!-- waveform -->
  <g fill="#3ee6c4">
    <rect x="240" y="330" width="8" height="20" rx="4"/><rect x="256" y="320" width="8" height="40" rx="4"/>
    <rect x="272" y="312" width="8" height="56" rx="4"/><rect x="288" y="324" width="8" height="32" rx="4"/>
    <rect x="304" y="308" width="8" height="64" rx="4"/><rect x="320" y="318" width="8" height="44" rx="4"/>
    <rect x="336" y="326" width="8" height="28" rx="4"/><rect x="352" y="332" width="8" height="16" rx="4"/>
  </g>
  <circle cx="300" cy="400" r="14" fill="#2fd38a"/>
  <!-- chat bubbles -->
  <g transform="translate(450 120)">
    <rect width="270" height="70" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="22" y="22" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="22" y="42" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
  </g>
  <g transform="translate(490 215)">
    <rect width="250" height="70" rx="20" fill="url(#avatar)"/>
    <rect x="22" y="22" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="22" y="42" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
  </g>
  <g transform="translate(450 310)">
    <rect width="200" height="56" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="40" cy="28" r="6" fill="#ffffff" fill-opacity="0.7"/><circle cx="60" cy="28" r="6" fill="#ffffff" fill-opacity="0.5"/><circle cx="80" cy="28" r="6" fill="#ffffff" fill-opacity="0.3"/>
  </g>
</svg>
